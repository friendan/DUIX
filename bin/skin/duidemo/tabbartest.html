<html>
    <VBox name="root" background-color="#F0F0F0FF">
        <HBox name="titlebar" height="40" background-color="#32323CFF" align-items="vcenter" gap="8" padding="0,8,0,8" action="title">
            <Label text="TabBar 测试" color="#C8C8C8FF" font-size="13" width="200" />
            <Spacer />
            <Button name="closebtn" text="✕" width="36" height="36" kind="none" background-color="#32323CFF" color="#B4B4BEFF" color-hover="#FFFFFFFF" background-color-hover="#E81123FF" action="close" />
        </HBox>

        <HBox height="44" gap="8" align-items="vcenter" padding="0,10,0,10" background-color="#E8E8ECFF">
            <Button name="btn_close_active" text="关闭当前" kind="danger" width="90" height="30" />
            <Button name="btn_toggle_lock" text="锁定/解锁" kind="warning" width="100" height="30" />
            <Button name="btn_remove_unlocked" text="清除未锁定" kind="default" width="110" height="30" />
            <CheckBox name="chk_block_close" text="拦截关闭" />
            <CheckBox name="chk_block_select" text="拦截切换" />
            <CheckBox name="chk_flexible" text="弹性宽度" selected="true" />
            <Spacer />
            <Label text="锁定钉左；双击关闭；右键菜单；拖拽排序；TabBar 空白可拖窗" color="#666666FF" />
        </HBox>

        <!-- action=title：空白区拖窗；标签 / + / 滚动钮仍可点 -->
        <TabBar name="tabbar" height="36" flexible="true" tab-min-width="100" tab-max-width="300" show-add="true"
            action="title" bind-tab-layout-name="pages" background-color="#F5F5F5FF"
            tab-background-color="#00000000" tab-background-color-hover="#D6EBFFFF" tab-background-color-selected="#BAE0FFFF"
            tab-color="#8C8C8CFF" tab-color-hover="#1677FFFF" tab-color-selected="#1677FFFF"
            tab-border-color-selected="#1677FFFF" tab-border-width-selected="2"
            close-color="#8C8C8CFF" close-background-color-hover="#DC3C3CFF" close-color-hover="#FFFFFFFF">
            <TabButton text="概况" tabler-outline="home" />
            <TabButton text="详情" locked="true" tabler-outline="info-circle" />
            <TabButton text="设置" tabler-outline="settings" />
            <TabButton text="原图PNG" icon="menu/icon.png" icon-size="14" />
            <TabButton text="autoPNG" icon="menu/icon.png" icon-tint="auto" icon-size="14" />
            <TabButton text="红tint" icon="menu/icon.png" icon-tint="#FF4D4FFF" icon-size="14" />
            <TabButton text="日志" tabler-outline="notebook" />
            <TabButton text="关于" tabler-outline="file-text" />
            <TabButton text="更多一" />
            <TabButton text="更多二" />
            <TabButton text="更多三" />
            <TabButton text="更多四" />
            <TabButton text="更多五" />
        </TabBar>

        <TabLayout name="pages" selected-id="0" background-color="#FFFFFFFF">
            <Label text="概况页 — 点击其它标签切换；点 ✕ 关闭（详情已锁定）" text-align="center" color="#333333FF" font-size="13" />
            <Label text="详情页 — 此标签 locked，关闭钮隐藏且不可删" text-align="center" color="#333333FF" font-size="13" />
            <Label text="设置页" text-align="center" color="#333333FF" font-size="13" />
            <Label text="原图PNG — 光栅默认不着色" text-align="center" color="#333333FF" font-size="13" />
            <Label text="autoPNG — icon-tint=auto 跟随 tab-color*" text-align="center" color="#333333FF" font-size="13" />
            <Label text="红tint — icon-tint 强制色" text-align="center" color="#333333FF" font-size="13" />
            <Label text="日志页" text-align="center" color="#333333FF" font-size="13" />
            <Label text="关于页" text-align="center" color="#333333FF" font-size="13" />
            <Label text="更多一 — 拖窄窗口后两侧出现 ‹ ›，也可滚轮" text-align="center" color="#333333FF" font-size="13" />
            <Label text="更多二 — 左键按住拖到另一标签上可排序" text-align="center" color="#333333FF" font-size="13" />
            <Label text="更多三" text-align="center" color="#333333FF" font-size="13" />
            <Label text="更多四" text-align="center" color="#333333FF" font-size="13" />
            <Label text="更多五" text-align="center" color="#333333FF" font-size="13" />
        </TabLayout>

        <HBox height="32" align-items="vcenter" padding="0,10,0,10" background-color="#EDEDF0FF">
            <Label name="status" text="就绪" color="#555555FF" />
        </HBox>
    </VBox>
</html>
<style>
  html {
    size: 900,560;
    caption: 0,0,0,40;
    min-size: 480,360;
    shadowimage: main/shadow.png;
  }
</style>
