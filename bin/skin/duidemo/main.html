<html theme="chrome" wallpaper-bleed="0.72">
    <VBox name="root">
        <TitleBar name="titlebar" title="title" height="40"
            show-min="true" min-to-tray="true" close-to-tray="false" show-max="true" show-close="true" action="title">
            <Spacer />
            <Button name="btn_wallpaper" lucide="image" width="36" height="40"
                tooltip="选择窗口背景图（wallpaper-bleed 透出）"
                margin="0,4,0,0" wallpaper-bleed="solid" kind="none" />
            <ThemeSwitcher name="themeSwitch" width="36" height="40"
                tooltip="选择主题" margin="0,8,0,0" />
        </TitleBar>
        <HBox>
            <!-- 左侧：大类导航（theme=panel；子 Option 继承 root chrome） -->
            <VBox name="nav_panel" width="168" theme="panel" border="0,0,1,0"
                padding="8,8,8,8" gap="4">
                <Label theme="secondary" text="控件分类" height="28" padding="0,8,0,8" />
                <Option name="nav_basic" group="demo_nav" text="基础" height="36"
                    kind="none" selected="true" text-align="center"
                    border-radius="6" />
                <Option name="nav_form" group="demo_nav" text="表单" height="36"
                    kind="none" text-align="center"
                    border-radius="6" />
                <Option name="nav_layout" group="demo_nav" text="布局" height="36"
                    kind="none" text-align="center"
                    border-radius="6" />
                <Option name="nav_feedback" group="demo_nav" text="反馈" height="36"
                    kind="none" text-align="center"
                    border-radius="6" />
                <Option name="nav_list" group="demo_nav" text="列表" height="36"
                    kind="none" text-align="center"
                    border-radius="6" />
                <Option name="nav_misc" group="demo_nav" text="综合" height="36"
                    kind="none" text-align="center"
                    border-radius="6" />
                <Spacer />
            </VBox>

            <!-- 右侧：透明底，露出窗口 color-bg -->
            <TabLayout name="tab_demo" selected-id="0">
                <!-- 0 基础 -->
                <Accordion mode="single" header-height="40">
                    <AccordionItem title="Button" active="false" header-align="left">
                      <HBox height="40" gap="8" padding="0,8,0,8">
                        <Button text="Default" kind="default" width="100" height="36" tooltip="默认按钮 kind=default" />
                        <Button text="info" kind="info" width="100" height="36" tooltip="信息按钮 kind=info" />
                        <Button text="Primary" kind="primary" width="100" height="36" tooltip="主按钮 kind=primary" />
                        <Button text="Success" kind="success" width="100" height="36" tooltip="成功按钮 kind=success" />
                        <Button text="Danger" kind="danger" width="100" height="36" tooltip="危险按钮 kind=danger" />
                        <Button text="Warning" kind="warning" width="100" height="36" tooltip="警告按钮 kind=warning" />
                        <Button text="Link" kind="link" width="100" height="36" tooltip="链接样式按钮 kind=link" />
                      </HBox>
                      <HBox height="56" gap="8" padding="0,8,0,8" align-items="vcenter">
                        <Button name="btn_edit_text_demo" text="右键改字" kind="primary" edit-text="true"
                            width="110" height="36" tooltip="edit-text：仅「修改文本」" />
                        <Button text="右键快捷键" kind="success" edit-hotkey="true"
                            width="120" height="48" tooltip="edit-hotkey：设置/清除快捷键 → sub-text" />
                        <Button text="两项都开" kind="info" edit-text="true" edit-hotkey="true"
                            width="110" height="48" tooltip="edit-text + edit-hotkey" />
                      </HBox>
                      <HBox height="56" gap="8" padding="0,8,0,8" align-items="vcenter">
                        <Button name="btn_shortcut_save" text="保存" sub-text="Ctrl+S" kind="primary" width="100" height="48"
                            tooltip="sub-text：主行功能 + 副行快捷键（默认副色）；已 SetShortcutKey 供冲突检测" />
                        <Button name="btn_shortcut_open" text="打开" sub-text="Ctrl+O" kind="default" lucide="folder-open" icon-size="16"
                            width="120" height="48" tooltip="sub-text + 图标；已 SetShortcutKey 供冲突检测" />
                        <Label text="sub-text 双行按钮" theme="secondary" />
                      </HBox>
                      <HBox height="40" gap="8" padding="0,8,0,8" align-items="vcenter">
                        <Button text="图标左" kind="primary" lucide="chevron-left" icon-position="left" icon-size="16" width="100" height="36" tooltip="icon-position=left（默认），图标+文字整体居中" />
                        <Button text="图标右" kind="success" lucide="chevron-right" icon-position="right" icon-size="16" width="100" height="36" tooltip="icon-position=right，图标在文字右侧" />
                        <Button text="新建" kind="primary" lucide="plus" icon-size="16" width="100" height="36" tooltip="lucide 图标 + 文字（默认 left）" />
                        <Button text="删除" kind="danger" bsicon="trash" width="100" height="36" />
                        <Button kind="info" lucide="search" icon-size="18" width="36" height="36" tooltip="纯图标按钮" />
                      </HBox>
                      <HBox height="64" gap="8" padding="0,8,0,8" align-items="vcenter">
                        <Button text="上传" kind="warning" iconpark="upload" icon-position="top" icon-size="18" width="72" height="56" tooltip="icon-position=top（图标在上）" />
                        <Button text="下载" kind="info" lucide="download" icon-position="bottom" icon-size="18" width="72" height="56" tooltip="icon-position=bottom（文字在上、图标在下）" />
                        <Label text="top=图标上；bottom=文字上" theme="secondary" />
                      </HBox>
                      <HBox height="48" gap="8" padding="0,8,8,8" align-items="vcenter">
                        <Button text="原图PNG" kind="default" icon="menu/icon.png" icon-size="16" width="90" height="36" tooltip="光栅默认原图，不着色" />
                        <Button text="auto" kind="primary" icon="menu/icon.png" icon-tint="auto" icon-size="16" width="80" height="36" tooltip="icon-tint=auto 跟随文字色" />
                        <Button text="红 tint" kind="default" icon="menu/icon.png" icon-tint="#FF4D4FFF" icon-size="16" width="90" height="36" tooltip="icon-tint 强制着色" />
                        <Button name="btn_icon_loading" text="提交" kind="primary" lucide="upload" loading-type="css" icon-size="16" width="110" height="36" tooltip="点击后 loading+自动禁用，约 2 秒后恢复" />
                        <Button name="btn_icon_css" text="悬停变色" kind="success" lucide="heart" icon-size="16" width="110" height="36" tooltip="CSS #btn_icon_css:hover { icon-tint }" />
                        <Label text="PNG · 提交自动禁用 2s · CSS tint" theme="secondary" />
                      </HBox>
                    </AccordionItem>
                    <AccordionItem title="Shape（异形）" active="false" header-align="left">
                      <VBox height="260" gap="10" padding="8,12,8,12">
                        <HBox height="120" gap="20" align-items="vcenter">
                          <Box width="120" height="120">
                            <Button name="btn_behind_shape" text="底下" kind="warning" width="100" height="36"
                                position="absolute" margin="42,10,0,0" />
                            <ShapeButton name="shape_btn_circle" shape-image="shape_circle.png" width="96" height="96"
                                position="absolute" margin="12,12,0,0"
                                text="圆" color="#FFFFFFFF" tooltip="仅圆内可点；圆外点穿到底下" />
                          </Box>
                          <ShapeButton name="shape_btn_star" shape-image="shape_star.png" width="96" height="96"
                              text="星" color="#FFFFFFFF" tooltip="仅星形内可点" />
                          <ShapeBox name="shape_box_demo" shape-image="shape_circle.png" width="96" height="96">
                            <Label text="Box" align="center" valign="vcenter" color="#FFFFFFFF" />
                          </ShapeBox>
                          <Button name="btn_shape_wnd" text="打开异形窗" kind="primary" width="110" height="36" />
                        </HBox>
                        <Label text="ShapeButton/ShapeBox：alpha 命中；可用 shape-mask 与 image 分离。窗口 FitToShapeImage + shape-drag。" theme="secondary" />
                      </VBox>
                    </AccordionItem>
                    <AccordionItem title="Switch" active="false" header-align="left">
                      <VBox height="150" gap="10" padding="8,12,8,12">
                        <HBox height="28" gap="16" align-items="vcenter">
                          <Switch text="默认关" />
                          <Switch checked="true" text="默认开" />
                          <Switch checked="true" disabled="true" text="禁用开" />
                          <Switch disabled="true" text="禁用关" />
                        </HBox>
                        <HBox height="28" gap="16" align-items="vcenter">
                          <CheckBox text="未选" />
                          <CheckBox selected="true" text="已选" />
                          <CheckBox selected="true" disabled="true" text="禁用已选" />
                          <CheckBox disabled="true" text="禁用未选" />
                        </HBox>
                        <HBox height="28" gap="16" align-items="vcenter">
                          <Switch checked-text="开" unchecked-text="关" track-size="52,24" />
                          <Switch checked="true" text="紫色" theme="none" track-color-checked="#722ED1FF" track-color-checked-hover="#531DABFF" />
                          <Switch checked="true" text="小号" track-size="28,16" />
                        </HBox>
                      </VBox>
                    </AccordionItem>
                    <AccordionItem title="FontIcon" active="false" header-align="left">
                      <VBox height="260" gap="8" padding="4,8,4,8">
                        <Label text="悬停跟主题/kind；也可 background-color-hover / color-hover。无 text 只画背景。" theme="secondary" />
                        <HBox height="48" gap="12" align-items="vcenter">
                          <FontIcon text="设" size="40" />
                          <FontIcon text="A" shape="rounded" size="40" />
                          <FontIcon text="OK" size="32" kind="success" />
                          <FontIcon text="!" size="32" kind="warning" />
                          <FontIcon text="×" size="32" kind="danger" />
                          <FontIcon text="i" size="32" kind="info" />
                          <FontIcon text="字" size="40" shape="rounded" background-color="#722ED1FF" color="#FFFFFFFF"
                            background-color-hover="#B37FEBFF" color-hover="#FFFFFFFF" />
                          <FontIcon size="32" />
                          <FontIcon size="32" shape="rounded" kind="secondary" />
                          <FontIcon size="24" background-color="#13C2C2FF" background-color-hover="#36CFC9FF" />
                          <Label text="← 悬停看变色" theme="secondary" />
                        </HBox>
                        <HBox height="48" gap="12" align-items="vcenter">
                          <FontIcon text="小" size="small" />
                          <FontIcon text="中" size="default" />
                          <FontIcon text="大" size="large" />
                          <FontIcon text="特" size="xlarge" shape="rounded" border-radius="10" />
                          <Label text="size 预设；末项自定义 border-radius" theme="secondary" />
                        </HBox>
                        <HBox height="48" gap="12" align-items="vcenter">
                          <FontIcon name="fonticon_click" text="点" size="40" clickable="true" kind="primary" tooltip="clickable：手型光标 + click 通知" />
                          <FontIcon name="fonticon_click2" text="GO" size="40" shape="rounded" clickable="true" kind="success" />
                          <Label text="← clickable 手型光标，点击出 Toast" theme="secondary" />
                        </HBox>
                      </VBox>
                    </AccordionItem>
