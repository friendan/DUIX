<?xml version="1.0" encoding="utf-8"?>
<html theme="chrome" size="440,600" caption="0,0,0,40" min-size="400,480">
  <VBox name="root">
    <TitleBar name="titlebar" title="导出图标" height="40"
      show-min="false" show-max="true" show-close="true" action="title" />
    <VBox padding="12,16,12,16" gap="10">
      <HBox height="72" gap="12" align-items="vcenter">
        <VBox width="72" height="72" align-items="center" justify-content="vcenter"
          background-color="#F0F0F0FF" border-radius="8">
          <SvgBox name="preview" width="48" height="48" />
        </VBox>
        <VBox gap="4">
          <Label name="lbl_name" text="" height="22" />
          <Label name="lbl_lib" text="" height="20" theme="secondary" text-overflow="ellipsis" />
          <Label text="可拖入 SVG；多色图标可能保留原色" height="18" theme="secondary" />
        </VBox>
        <VBox width="108" gap="6" justify-content="vcenter">
          <Button name="btn_open_svg" text="打开 SVG…" kind="default" height="28" />
          <Button name="btn_clipboard_svg" text="剪贴板 SVG" kind="default" height="28" />
        </VBox>
      </HBox>
      <Label text="格式" height="22" />
      <Segmented name="seg_format" options="PNG:png|JPG:jpg|BMP:bmp|ICO:ico" selected="png"
        height="32" />
      <Label name="lbl_fmt_hint" text="PNG：保留透明" height="20" theme="secondary" />
      <Label name="lbl_size_title" text="尺寸" height="22" />
      <HBox name="size_row_edit" height="28" gap="6" align-items="vcenter">
        <Edit name="edt_w" width="56" height="28" text="28" type="number" maxlength="4" />
        <Label text="×" width="14" height="28" text-align="center" />
        <Edit name="edt_h" width="56" height="28" text="28" type="number" maxlength="4" />
        <Label name="lbl_size_hint" text="px（默认控件大小）" theme="secondary" />
      </HBox>
      <HBox name="size_row_btns" height="28" gap="6" align-items="vcenter">
        <Button name="btn_size_ctrl" text="控件" kind="default" width="48" height="28" />
        <Button name="btn_size_32" text="32" kind="default" width="40" height="28" />
        <Button name="btn_size_64" text="64" kind="default" width="40" height="28" />
        <Button name="btn_size_128" text="128" kind="default" width="44" height="28" />
        <Button name="btn_size_256" text="256" kind="default" width="44" height="28" />
        <Button name="btn_size_512" text="512" kind="default" width="44" height="28" />
      </HBox>
      <Label text="颜色" height="22" />
      <HBox name="color_row" height="36" gap="6" align-items="vcenter" />
      <HBox height="28" gap="8" align-items="vcenter">
        <Button name="btn_custom_color" text="自定义…" kind="default" width="88" height="28" />
        <Button name="btn_no_tint" text="不着色" kind="default" width="72" height="28" />
        <Label name="lbl_color" text="" theme="secondary" />
      </HBox>
      <ColorPalette name="palette" height="160" palette-height="120" bar-height="14"
        visible="false" />
      <Label text="导出目录" height="22" />
      <HBox height="28" gap="8" align-items="vcenter">
        <Label name="lbl_dir" text="" theme="secondary" text-overflow="ellipsis" />
        <Button name="btn_browse_dir" text="选择目录…" kind="default" width="96" height="28" />
      </HBox>
      <Control />
      <HBox height="36" gap="8" align-items="vcenter">
        <Control />
        <Button name="btn_cancel" text="取消" kind="default" width="88" height="32" />
        <Button name="btn_export" text="导出" kind="primary" width="96" height="32" />
      </HBox>
    </VBox>
  </VBox>
</html>
<style>
  html {
    size: 440,600;
    caption: 0,0,0,40;
    min-size: 400,480;
  }
</style>
