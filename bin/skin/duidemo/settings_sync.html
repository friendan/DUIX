<?xml version="1.0" encoding="utf-8"?>
<!-- 铺满主窗的设置窗：测 WindowImplBase SyncOwnerMove + SyncOwnerSize（含最小化联动） -->
<Window size-box="4,4,6,6" min-size="480,320" caption="0,0,0,40" showshadow="false" theme="chrome">
  <Font id="0" font-family="Microsoft YaHei UI" font-size="13" default="true"/>
  <Font id="1" font-family="Microsoft YaHei UI" font-size="14" font-weight="bold"/>

  <VBox name="root">
    <TitleBar name="titlebar" title="设置（铺满主窗 · SyncOwner）" height="40"
      show-min="true" show-max="true" show-close="true" action="title" />

    <VBox padding="20,24,20,24" gap="12">
      <Label text="本窗覆盖主窗。拖标题栏或缩放边框时，主窗口同步移动/改变大小（含副屏负坐标、跨屏 DPI）。"
        height="48" word-break="break-word" />
      <Label text="测最小化：点标题栏「—」，主窗应一起收起；任务栏还原本窗后主窗应一起还原并对齐。"
        theme="secondary" height="40" word-break="break-word" />
      <Label text="测最大化：点「□」最大化本窗；还原后可再拖缩验证 SyncOwnerSize。API：SetSyncOwnerMove/Size(true) + ShowModal()。"
        theme="secondary" height="40" word-break="break-word" />
      <HBox height="40" gap="8" align-items="vcenter">
        <Button name="closebtn2" text="关闭" kind="primary" width="96" height="32" action="close" />
        <Label text="Esc / ✕ 亦可关闭" theme="secondary" />
      </HBox>
    </VBox>
  </VBox>
</Window>
