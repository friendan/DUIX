<html theme="chrome">
    <body name="root">
        <!-- 第一行：TitleBar 左侧放 TabBar，右侧系统按钮 -->
        <TitleBar name="titlebar" height="36" show-min="true" show-max="true" show-close="true" btn-width="45" padding="0" action="title">
            <TabBar name="tabbar" height="36" flexible="true" />
        </TitleBar>
        <!-- 第二行：地址栏 / 工具栏 -->
        <HBox name="addressBar" theme="panel" height="40">
            <Spacer width="100" />
            <Svg name="backBtn" tabler-outline="arrow-left" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" color-disabled="var(--color-border-strong)" />
            <Svg name="forwardBtn" tabler-outline="arrow-right" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" color-disabled="var(--color-border-strong)" />
            <Svg name="refreshBtn" bsicon="arrow-repeat" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" />
            <Svg name="homeBtn" tabler-outline="home" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" />
            <Spacer width="10" />
            <Edit name="urlBox" placeholder="输入网址后回车" maxlength="2048" flexible="true" />
            <Button name="goBtn" text="转到" kind="primary" width="52" height="28" />
            <Svg name="menuBtn" tabler-outline="dots-vertical" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" />
        </HBox>
        <!-- 第三行：侧边栏 + 页面 -->
        <HBox name="contentArea">
            <VBox name="sideToolBar" theme="panel">
                <Svg name="sideToolHome" tabler-outline="home" width="24" height="24"
                    color="var(--color-text-secondary)" color-hover="var(--color-primary)" />
                <Spacer height="16" />
                <Button name="btn_theme_default" text="默" tooltip="Default" kind="default" width="36" height="28" />
                <Button name="btn_theme_azure" text="蓝" tooltip="晴空蓝" kind="primary" width="36" height="28" />
                <Button name="btn_theme_emerald" text="绿" tooltip="翠绿" kind="success" width="36" height="28" />
                <Button name="btn_theme_graphite" text="灰" tooltip="石墨" kind="dark" width="36" height="28" />
                <Button name="btn_theme_dark" text="暗" tooltip="深色" kind="secondary" width="36" height="28" />
            </VBox>
            <TabLayout name="pages" />
        </HBox>
    </body>
</html>
<style>
    html {
        size: 1280, 800;
        size-box: 5, 5, 5, 5;
        caption: 0, 0, 0, 36;
        min-size: 800, 600;
        max-size: 0, 0;
        showshadow: false;
        action: title;
    }

    #titlebar {
        height: 36;
        padding: 0;
        action: title;
    }

    #tabbar {
        tab-min-width: 100;
        tab-max-width: 300;
        tab-loading-type: css;
        tab-loading-test-delay: 0;
        bind-tab-layout-name: pages;
        show-add: true;
        action: title;
    }

    #addressBar {
        height: 40;
        padding: 0,8,0,8;
        gap: 6;
        align-items: vcenter;
    }

    #urlBox {
        height: 28;
        padding: 4,10,4,10;
        border-radius: 7,7;
        border-width: 1;
    }

    #goBtn {
        height: 28;
        padding: 0,8,0,8;
        border-radius: 6,6;
    }

    #sideToolBar {
        width: 52;
        action: title;
        align-items: center;
        padding: 10,0,8,0;
        gap: 6;
    }
</style>
