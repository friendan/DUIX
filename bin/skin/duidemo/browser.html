<html theme="chrome">
    <body name="root" window-resize="all">
        <!-- 第一行：TitleBar 左侧放 TabBar，右侧系统按钮 -->
        <TitleBar name="titlebar" height="36" show-min="true" show-max="true" show-close="true" btn-width="45" padding="0" action="title">
            <TabBar name="tabbar" height="36" flexible="true" />
        </TitleBar>
        <!-- 第二行：地址栏 / 工具栏 -->
        <HBox name="addressBar" theme="panel" height="40">
            <Spacer width="100" />
            <Svg name="backBtn" tabler-outline="arrow-left" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" color-disabled="var(--color-border-strong)"
                background-color-hover="var(--color-bg-hover-medium)" border-radius="4" />
            <Svg name="forwardBtn" tabler-outline="arrow-right" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)" color-disabled="var(--color-border-strong)"
                background-color-hover="var(--color-bg-hover-medium)" border-radius="4" />
            <Svg name="refreshBtn" bsicon="arrow-repeat" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)"
                background-color-hover="var(--color-bg-hover-medium)" border-radius="4" tooltip="刷新" />
            <Svg name="homeBtn" tabler-outline="home" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)"
                background-color-hover="var(--color-bg-hover-medium)" border-radius="4" />
            <Spacer width="10" />
            <Edit name="urlBox" placeholder="输入网址或搜索内容后回车" maxlength="2048" flexible="true" />
            <Button name="goBtn" text="转到" kind="primary" width="52" height="28" />
            <Svg name="menuBtn" tabler-outline="dots-vertical" width="24" height="24"
                color="var(--color-text-secondary)" color-hover="var(--color-primary)"
                background-color-hover="var(--color-bg-hover-medium)" border-radius="4" tooltip="菜单" />
        </HBox>
        <!-- 第三行：侧边栏 + 页面（TabLayout 右/下边缩窗；勿再靠窗口 size-box 给 WebBrowser 让缝） -->
        <HBox name="contentArea">
            <VBox name="sideToolBar" theme="panel">
                <Svg name="sideToolHome" tabler-outline="home" width="24" height="24"
                    color="var(--color-text-secondary)" color-hover="var(--color-primary)"
                    background-color-hover="var(--color-bg-hover-medium)" border-radius="4" />
                <Spacer height="16" />
                <ThemeSwitcher name="themeSwitch" width="36" height="28" tooltip="选择主题" />
            </VBox>
            <TabLayout name="pages" window-resize="right,bottom" />
        </HBox>
    </body>
</html>
<style>
    html {
        size: 1280, 800;
        /* 置 0：WebBrowser 原生 HWND 不再为 size-box 内缩留缝；缩放靠 root/TabLayout 的 window-resize */
        size-box: 0, 0, 0, 0;
        caption: 0, 0, 0, 36;
        min-size: 800, 600;
        max-size: 0, 0;
        showshadow: false;
        action: title;
    }

    #root {
        window-resize: all;
    }

    #pages {
        window-resize: right,bottom;
    }

    #titlebar {
        height: 36;
        padding: 0;
        action: title;
    }

    #tabbar {
        tab-min-width: 100;
        tab-max-width: 300;
        tab-loading-type: css;
        tab-loading-test-delay: 0;
        bind-tab-layout-name: pages;
        show-add: true;
        action: title;
    }

    #addressBar {
        height: 40;
        padding: 0,8,0,8;
        gap: 6;
        align-items: vcenter;
    }

    #urlBox {
        height: 28;
        padding: 4,10,4,10;
        border-radius: 7,7;
        border-width: 1;
    }

    #goBtn {
        height: 28;
        padding: 0,8,0,8;
        border-radius: 6,6;
    }

    #sideToolBar {
        width: 52;
        action: title;
        align-items: center;
        padding: 10,0,8,0;
        gap: 6;
    }
</style>
