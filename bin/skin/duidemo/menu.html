<?xml version="1.0" encoding="utf-8"?>
<!-- 纯色 Menu：跟当前主题 token；勿再用 background-image 壳（图片菜单不会自动跟主题） -->
<Window>
  <Menu border-width="1" border-radius="4,4" padding="4,4,4,4" item-padding="0,14,0,14">
    <MenuElement name="lan" text="语言 / Language" resource-text="true"/>
    <MenuElement text="产品演示" expand="true">
      <MenuElement name="qianting" text="核潜艇" check-item="true" checked="false"/>
      <MenuElement name="yuanzidan" text="氢弹原子弹"/>
      <MenuElement name="huojian" text="长征系列" expand="true">
        <MenuElement name="cz5" text="CZ-5"/>
        <MenuElement name="cz7" text="CZ-7"/>
        <MenuElement name="cz9" text="CZ-9"/>
      </MenuElement>
    </MenuElement>
    <MenuElement name="menuitembtn_wrap" height="36">
      <HBox height="32" padding="0,8,0,8" align-items="vcenter">
        <Button name="menuitembtn" text="菜单内按钮" kind="default" height="28" width="120"/>
      </HBox>
    </MenuElement>
    <MenuElement name="exit" text="退出"/>
  </Menu>
</Window>
