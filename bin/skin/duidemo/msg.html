<?xml version="1.0" encoding="utf-8"?>
<Window caption="0,0,0,40" size="400,195" showshadow="true" shadowimage="main/shadow.png" shadowsize="6" shadowcorner="8,8,8,8">
  <Font id="0" font-family="微软雅黑" font-size="12" default="true"/>
  <Font id="1" font-family="微软雅黑" font-size="14"/>

  <vbox background-color="#666666FF">
    <hbox name="appbar" height="36" padding="0,0,0,0" align-items="vcenter" background-color="#202223FF">
    	<Label name="MessageTitle" vertical-align="vcenter" padding-left="12" text="提示" color="#FFFFFFFF" font-family="微软雅黑" font-size="14" />
      <Button name="closebtn" text="✕" width="39" height="28" kind="none"
        background-color="#202223FF" color="#B4B4BEFF" color-hover="#FFFFFFFF" background-color-hover="#E81123FF" />
    </hbox>
    <vbox padding="10,20,10,20">
      <Label name="MessageText" color="#FFFFFFFF" font-family="微软雅黑" font-size="14" text-align="left" vertical-align="vcenter"/>
    </vbox>
    <hbox height="60" padding="10,10,10,10" align-items="vcenter">
      <Control />
      <Button name="confirm_btn" text="确定" kind="primary" width="72" height="28" />
      <Control width="12"/>
      <Button name="cancel_btn" text="取消" kind="default" width="72" height="28" />
      <Control width="20"/>
    </hbox>
  </vbox>
</Window>
